[project]
name = "notch"
version = "0.0.1"
description = "Notebook where every cell is a task a local agent can execute"
requires-python = ">=3.11"
dependencies = ["marimo>=0.10", "pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notch*"]
